name: Render keep-alive

# Render free tier 15 daqiqa harakatsizlikdan keyin uxlaydi.
# Bu workflow /health ga so'rov yuborib serverni uyg'oq tutadi.
#
# Nega har 5 daqiqada:
#   GitHub cron "best-effort" — ba'zi runlar kechikadi yoki tushib qoladi.
#   12 daqiqada bitta run tushib qolsa 24 daqiqa bo'shliq -> server uxlaydi.
#   5 daqiqada esa ikkita ketma-ket run tushsa ham 15 daqiqaga yetmaydi.
#
# Nega "2-59/5" (2,7,12,...57) va "*/5" emas:
#   Soat boshidagi yumaloq daqiqalar (0,5,10...) eng gavjum — GitHub aynan
#   shu paytda runlarni kechiktiradi yoki tashlab yuboradi.
#
# Nega alohida public repo:
#   Private repo uchun oyiga 2000 Actions daqiqasi beriladi, 24/7 `*/5` esa
#   ~8600 daqiqa. Public repo'da daqiqalar cheksiz — asosiy kod private qoladi.
#
# Cron UTC bo'yicha ishlaydi.

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health
        run: |
          url="https://leadersacademy.onrender.com/health"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 70 "$url" || true)
            echo "urinish $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Server uyg'oq."
              exit 0
            fi
            sleep 20
          done
          echo "Server javob bermadi: $url"
          exit 1

  # GitHub public repo'da 60 kun harakatsizlikdan keyin `schedule`ni o'chirib qo'yadi.
  # Har kuni alive.txt ga bitta commit qilib jadval faol qoladi.
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Touch alive.txt (kuniga bir marta)
        run: |
          date -u +"%Y-%m-%d" > alive.txt
          if git diff --quiet -- alive.txt; then
            echo "Bugun allaqachon yangilangan."
            exit 0
          fi
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add alive.txt
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)"
          git push
